services:
  okf-mcp:
    build: .
    image: okf-mcp:latest
    command: ["start"]
    env_file:
      - .env
    volumes:
      - ~/.okf-mcp:/root/.okf-mcp
      - ~/.config/okf:/root/.config/okf
      - ~/okf-vaults:/vaults
    stdin_open: true
    tty: true

  okf-mcp-http:
    build: .
    image: okf-mcp:latest
    command: ["http", "--host", "0.0.0.0", "--port", "3000"]
    env_file:
      - .env
    environment:
      OKF_MCP_TRANSPORT: http
      OKF_MCP_PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ~/.okf-mcp:/root/.okf-mcp
      - ~/.config/okf:/root/.config/okf
      - ~/okf-vaults:/vaults
